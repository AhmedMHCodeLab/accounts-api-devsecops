metadata:
  name: "RDS deletion protection must be enabled"
  id: "CKV2_AWS_ACCOUNTS_4"
  category: "BACKUP_AND_RECOVERY"
  severity: "HIGH"

definition:
  and:
    - cond_type: filter
      attribute: resource_type
      value: aws_db_instance
      operator: within
    - cond_type: attribute
      resource_types:
        - aws_db_instance
      attribute: deletion_protection
      operator: equals
      value: true