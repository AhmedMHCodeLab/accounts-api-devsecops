metadata:
  name: "RDS must retain a final snapshot"
  id: "CKV2_AWS_ACCOUNTS_5"
  category: "BACKUP_AND_RECOVERY"
  severity: "HIGH"

definition:
  and:
    - cond_type: filter
      attribute: resource_type
      value: aws_db_instance
      operator: within
    - cond_type: attribute
      resource_types:
        - aws_db_instance
      attribute: skip_final_snapshot
      operator: equals
      value: false