metadata:
  name: "RDS automated backups must be enabled"
  id: "CKV2_AWS_ACCOUNTS_3"
  category: "BACKUP_AND_RECOVERY"
  severity: "HIGH"

definition:
  and:
    - cond_type: filter
      attribute: resource_type
      value: aws_db_instance
      operator: within
    - cond_type: attribute
      resource_types:
        - aws_db_instance
      attribute: backup_retention_period
      operator: greater_than
      value: 0