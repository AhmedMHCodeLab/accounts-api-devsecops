metadata:
  name: "RDS must not be publicly accessible"
  id: "CKV2_AWS_ACCOUNTS_1"
  category: "NETWORKING"
  severity: "CRITICAL"

definition:
  and:
    - cond_type: filter
      attribute: resource_type
      value: aws_db_instance
      operator: within
    - cond_type: attribute
      resource_types:
        - aws_db_instance
      attribute: publicly_accessible
      operator: equals
      value: false