metadata:
  name: "RDS storage must be encrypted"
  id: "CKV2_AWS_ACCOUNTS_2"
  category: "ENCRYPTION"
  severity: "CRITICAL"

definition:
  and:
    - cond_type: filter
      attribute: resource_type
      value: aws_db_instance
      operator: within
    - cond_type: attribute
      resource_types:
        - aws_db_instance
      attribute: storage_encrypted
      operator: equals
      value: true