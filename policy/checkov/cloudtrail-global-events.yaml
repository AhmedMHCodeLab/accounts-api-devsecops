metadata:
  name: "CloudTrail must include global service events"
  id: "CKV2_AWS_ACCOUNTS_7"
  category: "LOGGING"
  severity: "HIGH"

definition:
  and:
    - cond_type: filter
      attribute: resource_type
      value: aws_cloudtrail
      operator: within
    - cond_type: attribute
      resource_types:
        - aws_cloudtrail
      attribute: include_global_service_events
      operator: equals
      value: true