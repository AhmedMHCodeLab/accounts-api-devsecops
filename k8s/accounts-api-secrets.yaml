apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: accounts-api-secrets
  namespace: accounts
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "arn:aws:secretsmanager:ap-south-1:123456789012:secret:accounts-api/prod/db-REPLACE"
        objectType: "secretsmanager"